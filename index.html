<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tree Diagram Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Caveat:wght@400;600&family=Crimson+Pro:wght@400;600&family=DM+Serif+Display&family=EB+Garamond:wght@400;600&family=Hind:wght@400;600&family=JetBrains+Mono:wght@400;500&family=Libre+Baskerville:wght@400;700&family=Lora:wght@400;600&family=Merriweather:wght@400;700&family=Noto+Nastaliq+Urdu&family=Noto+Sans:wght@400;600&family=Noto+Sans+Arabic&family=Noto+Sans+Bengali:wght@400;600&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+JP&family=Noto+Sans+Kannada:wght@400;600&family=Noto+Sans+KR&family=Noto+Sans+SC&family=Noto+Sans+Tamil:wght@400;600&family=Noto+Sans+Telugu:wght@400;600&family=Open+Sans:wght@400;600&family=Playfair+Display:wght@400;700&family=Roboto:wght@400;500&family=Source+Serif+4:wght@400;600&family=Space+Mono&family=Spectral:wght@400;600&family=Syne:wght@400;700&family=Tiro+Devanagari&family=Unbounded:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --surface: #faf7f2;
    --surface2: #ede8de;
    --border: #c8bfaa;
    --border2: #a89880;
    --text: #1a1510;
    --text2: #5a4e3a;
    --text3: #8a7a62;
    --accent: #2d5a27;
    --accent2: #4a8a42;
    --accent3: #8db888;
    --node-bg: #fff;
    --node-border: #2d5a27;
    --line-color: #2d5a27;
    --toolbar-bg: #ede8de;
    --btn: #2d5a27;
    --btn-text: #fff;
    --btn-hover: #1e3d1a;
    --shadow: rgba(45,90,39,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Syne', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    background: var(--text);
    color: #fff;
    padding: 10px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 2px solid var(--accent);
  }
  header h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 1.25rem;
    letter-spacing: 0.02em;
    color: var(--accent3);
  }
  header .subtitle {
    font-size: 0.7rem;
    color: #888;
    font-family: 'Space Mono', monospace;
    margin-top: 1px;
  }
  .header-actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  /* TOOLBAR */
  .toolbar {
    background: var(--toolbar-bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .toolbar-group {
    display: flex;
    align-items: center;
    gap: 6px;
    padding-right: 12px;
    border-right: 1px solid var(--border2);
  }
  .toolbar-group:last-child { border-right: none; }
  .toolbar-label {
    font-size: 0.65rem;
    color: var(--text3);
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    white-space: nowrap;
  }

  select, input[type=range], input[type=number] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 8px;
    font-family: 'Syne', sans-serif;
    font-size: 0.8rem;
    outline: none;
    transition: border-color 0.2s;
  }
  select:focus, input:focus { border-color: var(--accent); }
  input[type=range] { padding: 4px 0; width: 80px; accent-color: var(--accent); }

  .btn {
    background: var(--btn);
    color: var(--btn-text);
    border: none;
    border-radius: 4px;
    padding: 5px 10px;
    font-size: 0.75rem;
    font-family: 'Syne', sans-serif;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--btn-hover); }
  .btn:active { transform: scale(0.97); }
  .btn.outline {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
  }
  .btn.outline:hover { background: var(--accent); color: #fff; }
  .btn.sym {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    font-family: monospace;
    font-size: 0.95rem;
    padding: 3px 7px;
    min-width: 28px;
  }
  .btn.sym:hover { background: var(--accent3); color: var(--text); border-color: var(--accent); }

  .font-size-display {
    font-size: 0.75rem;
    color: var(--text2);
    min-width: 28px;
    text-align: center;
    font-family: 'Space Mono', monospace;
  }

  /* MAIN LAYOUT */
  .main {
    display: flex;
    flex: 1;
    overflow: hidden;
    gap: 0;
  }

  /* EDITOR PANE */
  .editor-pane {
    width: 340px;
    min-width: 220px;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
    position: relative;
  }
  .pane-header {
    padding: 8px 14px;
    font-size: 0.65rem;
    font-family: 'Space Mono', monospace;
    color: var(--text3);
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  #editor {
    flex: 1;
    padding: 16px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.82rem;
    line-height: 1.7;
    background: var(--surface);
    color: var(--text);
    border: none;
    resize: none;
    outline: none;
    tab-size: 2;
    overflow-y: auto;
  }
  #editor::selection { background: var(--accent3); }

  /* RESIZE HANDLE */
  .resize-handle {
    width: 5px;
    background: var(--border);
    cursor: col-resize;
    flex-shrink: 0;
    transition: background 0.2s;
    position: relative;
    z-index: 10;
  }
  .resize-handle:hover { background: var(--accent); }

  /* CANVAS PANE */
  .canvas-pane {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }
  .canvas-pane .pane-header {
    background: var(--toolbar-bg);
  }
  .canvas-wrapper {
    flex: 1;
    overflow: auto;
    display: flex;
    align-items: flex-start;
    justify-content: flex-start;
    padding: 30px;
  }
  #treeCanvas {
    display: block;
    background: var(--node-bg);
    border-radius: 8px;
    box-shadow: 0 4px 24px var(--shadow);
  }

  /* DARK MODE */
  body.dark {
    --bg: #111410;
    --surface: #181c14;
    --surface2: #1e2418;
    --border: #2e3828;
    --border2: #3d4e35;
    --text: #e8ead4;
    --text2: #a8b090;
    --text3: #6a7a58;
    --accent: #6ab855;
    --accent2: #4a8a42;
    --accent3: #4d7a44;
    --node-bg: #1e2418;
    --node-border: #6ab855;
    --line-color: #6ab855;
    --toolbar-bg: #1a1f14;
    --btn: #5aaa48;
    --btn-hover: #6ab855;
    --shadow: rgba(0,0,0,0.4);
  }

  /* FONT SIZE LABEL */
  .size-val { font-variant-numeric: tabular-nums; }

  /* COLOR PICKERS */
  .color-pick-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    cursor: pointer;
  }
  .color-pick-label {
    font-size: 0.58rem;
    font-family: 'Space Mono', monospace;
    color: var(--text3);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  input[type=color] {
    -webkit-appearance: none;
    width: 28px;
    height: 22px;
    border: 1px solid var(--border2);
    border-radius: 4px;
    padding: 1px;
    background: var(--surface);
    cursor: pointer;
  }
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: none; border-radius: 3px; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-family: 'Space Mono', monospace;
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateY(0); }
</style>
</head>
<body>

<header>
  <div>
    <h1>🌿 TreeCraft</h1>
    <div class="subtitle">hierarchy diagram builder</div>
  </div>
  <div class="header-actions">
    <button class="btn outline" onclick="exportPNG()">Export PNG</button>
    <button class="btn outline" onclick="exportSVG()">Export SVG</button>
    <button class="btn" onclick="toggleDark()" id="darkBtn">◑ Dark</button>
  </div>
</header>

<div class="toolbar">

  <!-- FONT -->
  <div class="toolbar-group">
    <span class="toolbar-label">Font</span>
    <select id="fontSelect" onchange="render()">
      <optgroup label="✏ Handdrawn">
        <option value="Architects Daughter">Architects Daughter</option>
        <option value="Caveat">Caveat</option>
      </optgroup>
      <optgroup label="📐 Modern / UI">
        <option value="Syne" selected>Syne</option>
        <option value="Roboto">Roboto</option>
        <option value="Open Sans">Open Sans</option>
        <option value="Unbounded">Unbounded</option>
      </optgroup>
      <optgroup label="🎓 Academic / Formal">
        <option value="EB Garamond">EB Garamond</option>
        <option value="Libre Baskerville">Libre Baskerville</option>
        <option value="Source Serif 4">Source Serif 4</option>
        <option value="Merriweather">Merriweather</option>
        <option value="Spectral">Spectral</option>
      </optgroup>
      <optgroup label="📖 Editorial / Literary">
        <option value="DM Serif Display">DM Serif Display</option>
        <option value="Playfair Display">Playfair Display</option>
        <option value="Crimson Pro">Crimson Pro</option>
        <option value="Lora">Lora</option>
      </optgroup>
      <optgroup label="💻 Monospace">
        <option value="Space Mono">Space Mono</option>
        <option value="JetBrains Mono">JetBrains Mono</option>
      </optgroup>
      <optgroup label="🇮🇳 Indian Languages">
        <option value="Noto Sans Bengali">Noto Sans Bengali (বাংলা)</option>
        <option value="Noto Sans Devanagari">Noto Sans Devanagari (हिन्दी)</option>
        <option value="Tiro Devanagari">Tiro Devanagari (संस्कृत)</option>
        <option value="Hind">Hind (हिन्दी)</option>
        <option value="Noto Sans Tamil">Noto Sans Tamil (தமிழ்)</option>
        <option value="Noto Sans Telugu">Noto Sans Telugu (తెలుగు)</option>
        <option value="Noto Sans Kannada">Noto Sans Kannada (ಕನ್ನಡ)</option>
      </optgroup>
      <optgroup label="🌍 World Languages">
        <option value="Noto Sans">Noto Sans (Universal)</option>
        <option value="Noto Sans SC">Noto Sans SC (中文简体)</option>
        <option value="Noto Sans JP">Noto Sans JP (日本語)</option>
        <option value="Noto Sans KR">Noto Sans KR (한국어)</option>
        <option value="Noto Sans Arabic">Noto Sans Arabic (عربي)</option>
        <option value="Noto Nastaliq Urdu">Noto Nastaliq Urdu (اردو)</option>
      </optgroup>
    </select>
  </div>

  <!-- FONT SIZE -->
  <div class="toolbar-group">
    <span class="toolbar-label">Font Size</span>
    <input type="number" id="fontSizeInput" min="8" max="72" value="15" style="width:52px" oninput="updateFontSizeInput(this.value)">
    <span class="toolbar-label">px</span>
  </div>

  <!-- CANVAS SIZE -->
  <div class="toolbar-group">
    <span class="toolbar-label">Canvas</span>
    <select id="canvasPreset" onchange="render()">
      <option value="auto">Auto</option>
      <option value="a4p">A4 Portrait</option>
      <option value="a4l">A4 Landscape</option>
      <option value="letter">Letter</option>
      <option value="hd">1920×1080</option>
      <option value="hd720">1280×720</option>
      <option value="sq">Square</option>
    </select>
  </div>

  <!-- FONT WEIGHT -->
  <div class="toolbar-group">
    <span class="toolbar-label">Weight</span>
    <select id="fontWeight" onchange="render()">
      <option value="300">Light</option>
      <option value="400" selected>Regular</option>
      <option value="600">Semi-Bold</option>
      <option value="700">Bold</option>
    </select>
  </div>

  <!-- NODE SCALE -->
  <div class="toolbar-group">
    <span class="toolbar-label">Node Scale</span>
    <input type="range" id="nodeScaleRange" min="1" max="5" step="0.1" value="2" oninput="updateNodeScale(this.value)">
    <span class="font-size-display size-val" id="nodeScaleLabel">2</span>
  </div>

  <!-- LAYOUT -->
  <div class="toolbar-group">
    <span class="toolbar-label">Layout</span>
    <select id="layoutSelect" onchange="render()">
      <option value="topdown">Top → Down</option>
      <option value="leftright">Left → Right</option>
    </select>
  </div>

  <!-- NODE STYLE -->
  <div class="toolbar-group">
    <span class="toolbar-label">Nodes</span>
    <select id="nodeStyle" onchange="render()">
      <option value="rect">Rectangle</option>
      <option value="rounded">Rounded</option>
      <option value="pill">Pill</option>
      <option value="none">No box</option>
    </select>
  </div>

  <!-- INDENT/OUTDENT -->
  <div class="toolbar-group">
    <span class="toolbar-label">Level</span>
    <button class="btn" title="Make Child (indent)" onclick="indentLine(1)">⇥ Child</button>
    <button class="btn outline" title="Make Parent (outdent)" onclick="indentLine(-1)">⇤ Parent</button>
  </div>

  <!-- SPACING -->
  <div class="toolbar-group">
    <span class="toolbar-label">H Spacing</span>
    <input type="range" id="spacingH" min="10" max="200" value="30" oninput="render()">
    <span class="font-size-display size-val" id="spacingHLabel">30</span>
  </div>
  <div class="toolbar-group">
    <span class="toolbar-label">V Spacing</span>
    <input type="range" id="spacingV" min="10" max="200" value="50" oninput="render()">
    <span class="font-size-display size-val" id="spacingVLabel">50</span>
  </div>

  <!-- COLORS -->
  <div class="toolbar-group">
    <span class="toolbar-label">Colors</span>
    <label class="color-pick-wrap" title="Canvas background">
      <span class="color-pick-label">BG</span>
      <input type="color" id="colorBg" value="#f5f0e8" oninput="render()">
    </label>
    <label class="color-pick-wrap" title="Node fill">
      <span class="color-pick-label">Node</span>
      <input type="color" id="colorNode" value="#ffffff" oninput="render()">
    </label>
    <label class="color-pick-wrap" title="Border & lines">
      <span class="color-pick-label">Line</span>
      <input type="color" id="colorLine" value="#2d5a27" oninput="render()">
    </label>
    <label class="color-pick-wrap" title="Text colour">
      <span class="color-pick-label">Text</span>
      <input type="color" id="colorText" value="#1a1510" oninput="render()">
    </label>
    <button class="btn outline" style="font-size:0.7rem;padding:4px 8px" onclick="resetColors()">↺ Reset</button>
  </div>

</div>

<div class="main">
  <!-- EDITOR -->
  <div class="editor-pane" id="editorPane">
    <div class="pane-header">
      <span>✏ Input Tree</span>
      <div style="display:flex;gap:4px;align-items:center">
        <input id="diagramTitle" type="text" placeholder="Header" title="Title shown above diagram"
               style="width:88px;font-size:0.65rem;padding:2px 6px;text-transform:none;letter-spacing:0"
               oninput="render()">
        <input id="diagramSubtitle" type="text" placeholder="Subheader" title="Subtitle shown below title"
               style="width:88px;font-size:0.65rem;padding:2px 6px;text-transform:none;letter-spacing:0"
               oninput="render()">
      </div>
    </div>
    <textarea id="editor" spellcheck="false" oninput="render()">নিয়ত ভূমিবিন্যাস
  নকর
  নকলপার্শ্বীয়
    বৃদ্ধিসংকোচন
    হ্রাসবৃদ্ধি
  দ্বি-পার্শ্বীয়
  বহুপার্শ্বীয়</textarea>
  </div>

  <div class="resize-handle" id="resizeHandle"></div>

  <!-- CANVAS -->
  <div class="canvas-pane">
    <div class="pane-header">
      <span>🌿 Tree Diagram · <span id="nodeCount">0 nodes</span></span>
      <div style="display:flex;gap:4px;align-items:center">
        <button class="btn sym" onclick="zoom(-0.25)" title="Zoom out">−</button>
        <span id="zoomLabel" class="font-size-display" style="min-width:36px;text-align:center">100%</span>
        <button class="btn sym" onclick="zoom(0.25)" title="Zoom in">+</button>
        <button class="btn outline" style="font-size:0.65rem;padding:3px 8px" onclick="fitToScreen()">Fit</button>
      </div>
    </div>
    <div class="canvas-wrapper" id="canvasWrapper">
      <canvas id="treeCanvas"></canvas>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/parser.js"></script>
<script src="js/layout.js"></script>
<script src="js/draw.js"></script>
<script src="js/app.js"></script>

</body>
</html>
